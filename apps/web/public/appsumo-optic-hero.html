<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AppSumo Optic hero — 1920×1080</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #1a1f1c;
      font-family: "DM Sans", system-ui, sans-serif;
      color: #e8eeea;
      padding: 1.25rem;
    }

    .meta {
      max-width: 1920px;
      margin: 0 auto 1rem;
      font-size: 0.85rem;
      color: #96a29c;
      line-height: 1.45;
    }

    .meta strong { color: #e8eeea; }

    /* Exact AppSumo hero export canvas */
    #hero {
      width: 1920px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      background: #eceeed;
      border-radius: 0;
      margin: 0 auto;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }

    .logo {
      position: absolute;
      top: 56px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 5;
    }

    .logo img {
      width: 44px;
      height: 44px;
      display: block;
    }

    .logo span {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #0b100e;
    }

    .logo em {
      font-style: normal;
      font-weight: 600;
      color: #0e7c5a;
      margin-left: 0.28em;
    }

    .stage {
      position: absolute;
      inset: 0;
      top: 120px;
    }

    .shot {
      position: absolute;
      border-radius: 14px;
      overflow: hidden;
      background: #fff;
      box-shadow:
        0 2px 4px rgba(11, 16, 14, 0.04),
        0 18px 40px rgba(11, 16, 14, 0.14),
        0 40px 80px rgba(11, 16, 14, 0.1);
      border: 1px solid rgba(11, 16, 14, 0.06);
    }

    .shot img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top left;
    }

    /* Back-left: mission / discovery UI */
    .shot-mission {
      width: 720px;
      height: 560px;
      left: 72px;
      top: 120px;
      transform: rotate(-4.5deg);
      z-index: 1;
    }

    /* Center hero: vault */
    .shot-vault {
      width: 1180px;
      height: 760px;
      left: 370px;
      top: 40px;
      transform: rotate(0.4deg);
      z-index: 2;
    }

    /* Front-right: outreach email card */
    .shot-outreach {
      width: 520px;
      height: 270px;
      right: 88px;
      bottom: 96px;
      transform: rotate(3.2deg);
      z-index: 3;
      box-shadow:
        0 4px 12px rgba(11, 16, 14, 0.08),
        0 28px 56px rgba(11, 16, 14, 0.18);
    }

    .shot-outreach img {
      object-fit: contain;
      background: #f7f8f7;
    }
  </style>
</head>
<body>
  <p class="meta">
    <strong>AppSumo Optic hero</strong> · Preview of the exported collage.
    Upload <code>appsumo-optic-hero.png</code> or <code>appsumo-optic-hero.jpg</code> (1920×1080) to the Hero image slot.
    Deal name, price, and tacos are filled by AppSumo from the listing form.
  </p>

  <img
    id="hero"
    src="/appsumo-optic-hero.png"
    width="1920"
    height="1080"
    alt="AppSumo Optic hero banner"
    style="display:block;width:min(100%,1920px);height:auto;margin:0 auto;box-shadow:0 24px 80px rgba(0,0,0,.35)"
  />
</body>
</html>
